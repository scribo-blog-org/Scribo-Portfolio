name: Update Code Statistics

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: scribo-blog-org/Scribo_frontend
          ref: master
          path: repos/frontend
          fetch-depth: 0

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: scribo-blog-org/Scribo_backend
          ref: master
          path: repos/backend
          fetch-depth: 0

      - name: Find first commits
        run: |
          FRONTEND_FIRST_COMMIT=$(git -C repos/frontend log --reverse --format=%aI | head -n 1)
          BACKEND_FIRST_COMMIT=$(git -C repos/backend log --reverse --format=%aI | head -n 1)

          echo "Frontend first commit: $FRONTEND_FIRST_COMMIT"
          echo "Backend first commit: $BACKEND_FIRST_COMMIT"

          if [ "$FRONTEND_FIRST_COMMIT" \< "$BACKEND_FIRST_COMMIT" ]; then
            FIRST_ACTION="$FRONTEND_FIRST_COMMIT"
          else
            FIRST_ACTION="$BACKEND_FIRST_COMMIT"
          fi

          echo "First action: $FIRST_ACTION"

          echo "FIRST_ACTION=$FIRST_ACTION" >> "$GITHUB_ENV"

      - name: Run code counter
        env:
          FIRST_ACTION: ${{ env.FIRST_ACTION }}
        run: node scripts/count_code.js

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add code-stats.json

          if git diff --cached --quiet; then
            echo "Statistics haven't changed."
            exit 0
          fi

          git commit -m "Update code statistics"
          git push
